services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: goob_test
      POSTGRES_PASSWORD: local_test_only
      POSTGRES_DB: goob_test
    ports: ["127.0.0.1:55439:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goob_test"]
      interval: 2s
      retries: 15
    tmpfs: ["/var/lib/postgresql"]
