server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;
    client_max_body_size 2m;
    # Until HTTPS is configured, access through an SSH tunnel only.
    # Remove these two lines AFTER enabling HTTPS with redirect.
    allow 127.0.0.1;
    deny all;
    auth_basic "Tiger staging";
    auth_basic_user_file /etc/nginx/tiger.htpasswd;
    access_log /var/log/nginx/tiger.access.log;
    error_log /var/log/nginx/tiger.error.log;
    location /.well-known/acme-challenge/ {
        allow all;
        auth_basic off;
        root /var/www/letsencrypt;
    }
    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
